name: verify

on:
  push:
    branches: [main, "carlos/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pypogo/requirements-dev.txt

      # .npmrc sets legacy-peer-deps; see the comment there for why.
      - name: Install node dependencies
        run: npm ci

      - name: Install python toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pypogo/requirements-dev.txt
          python -m pip install -e pypogo

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # verify.sh falls back to the PATH python when pypogo/.venv is absent,
      # which is exactly the CI setup above.
      - name: Run the gate
        run: npm run verify:all

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
